<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Document Scanner PoC</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Document Scanner PoC</h1>
        <p>Detects a document's edges and outlines them live, using OpenCV.js.</p>
      </header>

      <div class="mode-toggle">
        <button id="mode-webcam" class="active" type="button">Webcam</button>
        <button id="mode-upload" type="button">Upload Image</button>
      </div>

      <div class="scanner-layout">
        <div class="scanner-main">
          <section id="webcam-panel" class="panel">
            <div class="stage">
              <video id="video" autoplay muted playsinline></video>
              <canvas id="overlay-canvas"></canvas>
              <canvas id="debug-canvas"></canvas>
              <div class="stage-ui">
                <p id="status" class="stage-status" aria-live="polite">Loading OpenCV.js&hellip;</p>
                <button id="capture-btn" class="capture-btn" type="button" disabled>
                  Capture
                </button>
              </div>
            </div>
          </section>

          <section id="upload-panel" class="panel hidden">
            <p id="upload-status" class="upload-status" aria-live="polite"></p>
            <input id="file-input" type="file" accept="image/*" />
            <div class="stage">
              <canvas id="upload-canvas"></canvas>
            </div>
          </section>
        </div>

        <aside class="debug-panel">
          <h3>Debug Info</h3>
          <dl id="debug-list"></dl>
          <h3>Debug Layers</h3>
          <p class="debug-hint">Webcam: toggle overlays. Upload: CV/ML/fused quads on preview.</p>
          <div id="debug-layers" class="debug-layers"></div>
        </aside>
      </div>

      <section id="result-panel" class="hidden">
        <h2>Flattened Result</h2>
        <canvas id="result-canvas"></canvas>
        <a id="download-link" download="scanned-document.png">Download PNG</a>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
